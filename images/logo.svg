<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6fc4"/>
      <stop offset="0.62" stop-color="#7fa8e3"/>
      <stop offset="1" stop-color="#f6c98a"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f5c"/>
      <stop offset="1" stop-color="#0d1222"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.55" stop-color="#f4cf7c"/>
      <stop offset="1" stop-color="#e0a24c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3a3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe3a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dc9c"/>
      <stop offset="0.5" stop-color="#e2b866"/>
      <stop offset="1" stop-color="#b98a3e"/>
    </linearGradient>
    <clipPath id="face"><circle cx="256" cy="256" r="206"/></clipPath>
    <mask id="crescent"><circle cx="338" cy="368" r="56" fill="#fff"/><circle cx="364" cy="346" r="48" fill="#000"/></mask>
  </defs>

  <!-- dark disc and gold rim -->
  <circle cx="256" cy="256" r="250" fill="#12161e"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#rim)" stroke-width="22"/>

  <!-- face: day above a curved horizon, night below -->
  <g clip-path="url(#face)">
    <rect x="0" y="0" width="512" height="512" fill="url(#night)"/>
    <path d="M40 290 Q256 236 472 290 L472 0 L40 0 Z" fill="url(#day)"/>
    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="150" cy="352" r="4.5"/><circle cx="208" cy="402" r="3"/><circle cx="118" cy="408" r="3"/>
      <circle cx="262" cy="440" r="3.5"/><circle cx="180" cy="318" r="2.5"/>
    </g>
    <!-- crescent moon -->
    <circle cx="338" cy="368" r="56" fill="#b4c9f5" mask="url(#crescent)"/>
    <!-- sun with glow -->
    <circle cx="186" cy="176" r="96" fill="url(#glow)"/>
    <circle cx="186" cy="176" r="52" fill="url(#sun)"/>
    <!-- horizon line -->
    <path d="M40 290 Q256 236 472 290" fill="none" stroke="#f7dc9c" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- hour ticks on the rim (24 small, 4 large) -->
  <g stroke="#12161e" stroke-linecap="round">
    <g stroke-width="5">
      <line x1="256" y1="35" x2="256" y2="55"/><line x1="256" y1="457" x2="256" y2="477"/>
      <line x1="35" y1="256" x2="55" y2="256"/><line x1="457" y1="256" x2="477" y2="256"/>
    </g>
  </g>

  <!-- the dial hand from the hub towards the sun -->
  <line x1="256" y1="256" x2="206" y2="198" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="17" fill="#ffffff"/>
  <circle cx="256" cy="256" r="7" fill="#12161e"/>
</svg>
